<rect x="300" y="148" width="0" height="12" rx="6" fill="var(--mut)"><animate attributeName="width" from="0" to="421.2" dur="1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/></rect>
<text x="834" y="159" class="mono ink2" font-size="14" font-weight="600">81%</text>
<text x="288" y="180" text-anchor="end" class="sans mut" font-size="11.5">refinery</text>
<rect x="300" y="170" width="520" height="12" rx="6" fill="var(--track)"/>
<rect x="300" y="170" width="0" height="12" rx="6" fill="var(--acc)"><animate attributeName="width" from="0" to="512.7" dur="1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/></rect>
<text x="834" y="181" class="mono acc" font-size="14" font-weight="600">98.6%</text>
<text x="44" y="236" class="sans ink" font-size="15" font-weight="600">Maths, Llama only</text>
