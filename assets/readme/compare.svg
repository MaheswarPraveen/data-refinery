<rect x="300" y="220" width="0" height="12" rx="6" fill="var(--mut)"><animate attributeName="width" from="0" to="383.2" dur="1s" begin="0.70s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/></rect>
<text x="834" y="231" class="mono ink2" font-size="14" font-weight="600">73.7%</text>
<text x="288" y="252" text-anchor="end" class="sans mut" font-size="11.5">refinery</text>
<rect x="300" y="242" width="520" height="12" rx="6" fill="var(--track)"/>
<rect x="300" y="242" width="0" height="12" rx="6" fill="var(--acc)"><animate attributeName="width" from="0" to="513.2" dur="1s" begin="0.70s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/></rect>
<text x="834" y="253" class="mono acc" font-size="14" font-weight="600">98.7%</text>
<text x="44" y="282" class="sans mut" font-size="12">Checked afterwards against official answers the nodes never saw.</text>
