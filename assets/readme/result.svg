<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Main result: wrong labels fell from 35.5% to 1.3%; 78 of 93 hidden errors were fixed.">
<style>
  svg { --bg:#fbfaf7; --ink:#141413; --ink2:#4d4c48; --mut:#8a8880; --rule:#e2e0d8; --track:#ebe9e2;
        --acc:#6d4fd8; --acc2:#b3a2f0; --good:#1d7a3e; --bad:#c0392b; --warn:#d97b1a; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#161b22; --ink:#ecebe6; --ink2:#b8b6ae; --mut:#8b949e; --rule:#30363d; --track:#21262d;
          --acc:#9a82f2; --acc2:#5b43bf; --good:#5cbf7c; --bad:#e57368; --warn:#e8973f; } }
  .card { fill: var(--bg); stroke: var(--rule); }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
  .ink { fill: var(--ink); } .ink2 { fill: var(--ink2); } .mut { fill: var(--mut); } .acc { fill: var(--acc); }
  .good { fill: var(--good); } .bad { fill: var(--bad); } .warn { fill: var(--warn); }
  .cap { font-size: 11px; letter-spacing: .12em; fill: var(--mut); }
</style>
<rect class="card" x="1" y="1" width="958" height="328" rx="14"/>
<text x="44" y="56" class="sans cap">MAIN RESULT · ERROR DETECTION ON A LABELLED DATASET</text>
<text x="44" y="138" class="mono bad" font-size="64" font-weight="600" letter-spacing="-3">35.5%</text>
<text x="232" y="130" class="sans mut" font-size="40">→</text>
<text x="282" y="138" class="mono good" font-size="64" font-weight="600" letter-spacing="-3">1.3%</text>
<text x="44" y="172" class="sans ink2" font-size="16">wrong labels in the dataset, before and after</text>
<text x="44" y="214" class="sans ink" font-size="15">93 wrong answers hidden among 262 problems.</text>
<text x="44" y="238" class="sans ink" font-size="15">The models never saw them, and fixed <tspan font-weight="700" class="acc">78 of 93</tspan>.</text>
<text x="44" y="278" class="sans mut" font-size="13">A 27× cleaner dataset, with no human labelling.</text>
<text x="470" y="78" class="sans cap">WHAT HAPPENED TO EACH LABEL</text>
<rect x="470.0" y="96" width="0" height="26" fill="var(--acc)"><animate attributeName="width" from="0" to="87.3" dur=".8s" begin="0.2s" fill="freeze"/></rect>
<rect x="470" y="144" width="10" height="10" rx="2" fill="var(--acc)" stroke="var(--mut)" stroke-width="0"/><text x="486" y="153" class="sans ink2" font-size="12.5">corrected 78</text>
<rect x="559.3" y="96" width="0" height="26" fill="var(--acc2)"><animate attributeName="width" from="0" to="160.6" dur=".8s" begin="0.4s" fill="freeze"/></rect>
<rect x="470" y="166" width="10" height="10" rx="2" fill="var(--acc2)" stroke="var(--mut)" stroke-width="0"/><text x="486" y="175" class="sans ink2" font-size="12.5">confirmed 142</text>
<rect x="721.9" y="96" width="0" height="26" fill="var(--track)"><animate attributeName="width" from="0" to="42.7" dur=".8s" begin="0.6s" fill="freeze"/></rect>
<rect x="470" y="188" width="10" height="10" rx="2" fill="var(--track)" stroke="var(--mut)" stroke-width="1"/><text x="486" y="197" class="sans ink2" font-size="12.5">sent to review 39</text>
<rect x="766.6" y="96" width="0" height="26" fill="var(--bad)"><animate attributeName="width" from="0" to="2.0" dur=".8s" begin="0.8s" fill="freeze"/></rect>
<rect x="470" y="210" width="10" height="10" rx="2" fill="var(--bad)" stroke="var(--mut)" stroke-width="0"/><text x="486" y="219" class="sans ink2" font-size="12.5">changed in error 3</text>
<text x="860" y="70" class="sans cap" text-anchor="middle">ERROR RATE</text>
<rect x="812" y="90" width="44" height="170" rx="8" fill="var(--track)"/>
<rect x="812" y="260" width="44" height="0" rx="8" fill="var(--bad)"><animate attributeName="height" from="0" to="170.0" dur="1s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/><animate attributeName="y" from="260" to="90.0" dur="1s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/></rect>
<text x="834" y="284" text-anchor="middle" class="mono ink" font-size="16" font-weight="600">35.5%</text>
<text x="834" y="302" text-anchor="middle" class="sans mut" font-size="11">before</text>
<rect x="882" y="90" width="44" height="170" rx="8" fill="var(--track)"/>
<rect x="882" y="260" width="44" height="0" rx="8" fill="var(--good)"><animate attributeName="height" from="0" to="6.225352112676056" dur="1s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/><animate attributeName="y" from="260" to="253.77464788732394" dur="1s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/></rect>
<text x="904" y="284" text-anchor="middle" class="mono ink" font-size="16" font-weight="600">1.3%</text>
<text x="904" y="302" text-anchor="middle" class="sans mut" font-size="11">after</text>
</svg>
